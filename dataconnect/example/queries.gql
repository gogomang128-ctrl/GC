query GetStoreAccount($id: UUID!) @auth(level: USER) {
  storeAccount(id: $id) {
    email
    storeName
    phoneNumber
    location
  }
}

query ListStoreAccounts @auth(level: USER) {
  storeAccounts {
    id
    email
    storeName
  }
}

mutation CreateStoreAccount($data: StoreAccount_Data!) @auth(level: USER) {
  storeAccount_insert(data: $data)
}

mutation UpdateStoreAccount($id: UUID!, $data: StoreAccount_Data!) @auth(level: USER) {
  storeAccount_update(id: $id, data: $data)
}

mutation DeleteStoreAccount($id: UUID!) @auth(level: USER) {
  storeAccount_delete(id: $id)
}

query GetGenre($id: UUID!) @auth(level: PUBLIC, insecureReason: "Genre data is non-sensitive and publicly shared.") {
  genre(id: $id) {
    name
    description
  }
}

query ListGenres @auth(level: PUBLIC, insecureReason: "Genre list is non-sensitive.") {
